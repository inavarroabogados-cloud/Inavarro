<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#172f41" />
    <meta
      property="og:title"
      content="¿ESTO ES LEGAL? · Cinco retos y siete personajes"
    />
    <meta
      property="og:description"
      content="Encuentra el matiz en Villa Lex. Videojuego de demostración con normas inventadas, no asesoramiento jurídico."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://inavarro-abogados.onrender.com/esto-es-legal/exports/don-lex-horizontal.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="description"
      content="Cinco retos, siete personajes y muchas ganas de encontrar el matiz. Videojuego de demostración de iNavarro Abogados."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <title>¿ESTO ES LEGAL? · El juego · iNavarro Abogados</title>
    <link rel="stylesheet" href="game.css" />
    <script type="module" src="game.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Saltar al juego</a>
    <header class="topbar">
      <a href="/" class="brand">iNAVARRO<span>ABOGADOS / PLAY LAB</span></a>
      <div class="header-controls">
        <button
          id="motion"
          aria-pressed="false"
          aria-label="Reducir movimiento"
        >
          Movimiento</button
        ><button id="music" aria-pressed="false" aria-label="Activar música">
          Música <span aria-hidden="true">♪</span></button
        ><button
          id="effects"
          aria-pressed="false"
          aria-label="Activar efectos sonoros"
        >
          Efectos <span aria-hidden="true">♫</span>
        </button>
      </div>
    </header>
    <div class="demo-banner">
      MODO DEMOSTRACIÓN
      <span>Normas inventadas. No es asesoramiento jurídico.</span>
    </div>
    <main id="main" tabindex="-1"></main>
    <footer>
      <a href="personajes/">Conoce al elenco →</a
      ><span>Una experiencia de iNavarro Abogados</span
      ><a href="/y-ahora-que/">Preparar una consulta →</a>
    </footer>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <dialog id="exit-dialog" aria-labelledby="exit-title">
      <h2 id="exit-title">¿Dejamos este reto?</h2>
      <p>La partida no se guarda. Puedes volver a empezar cuando quieras.</p>
      <div class="dialog-actions">
        <button id="keep-playing">Seguir jugando</button
        ><button id="confirm-exit">Salir al inicio</button>
      </div>
    </dialog>
    <noscript
      ><p class="noscript">
        Activa JavaScript para jugar. Puedes visitar la
        <a href="personajes/">galería del elenco</a> sin iniciar una partida.
      </p></noscript
    >
  </body>
</html>
